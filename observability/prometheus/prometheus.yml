global:
  scrape_interval: 10s

scrape_configs:
  - job_name: transaction-service
    metrics_path: /metrics
    static_configs:
      - targets: ["transaction-service:8080"]

  - job_name: bancs-adapter
    metrics_path: /metrics
    static_configs:
      - targets: ["bancs-adapter:8081"]

  - job_name: ai-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-service:8082"]
